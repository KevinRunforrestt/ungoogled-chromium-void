name: Auto-update package

# This workflow keeps the ungoogled-chromium template in sync with upstream:
#   1. Polls ChromiumDash for the latest stable Chromium release.
#   2. Verifies the matching ungoogled-chromium tag (revisions 1..5) exists.
#   3. Verifies the chromium-linux-tarballs release for that version exists.
#   4. Rewrites `version=`, `revision=` and `checksum=` in BOTH template files
#      (downloads every distfile and computes sha256 locally — equivalent to
#      `xgensum -f` but portable to ubuntu-latest).
#   5. Refreshes the VERSION-INFO block in README.md.
#   6. Commits and pushes. The push triggers `create-release.yml`, which
#      bootstraps + configures + builds + signs + publishes the .xbps packages.
#
# It does NOT trigger itself on push (only on schedule + dispatch), so there
# is no loop with create-release.yml.

on:
  schedule:
    # Every 6 hours at 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a re-run even if the version is unchanged (useful to refresh checksums)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Default token needs write access to push the bump commit AND to dispatch
# create-release.yml afterwards (a GITHUB_TOKEN push does NOT retrigger other
# push-triggered workflows, so we use workflow_dispatch instead).
permissions:
  contents: write
  actions: write

concurrency:
  group: auto-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-update:
    if: github.repository == 'KevinRunforrestt/ungoogled-chromium-void'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      new_version: ${{ steps.update.outputs.new_version }}
      new_revision: ${{ steps.update.outputs.new_revision }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Show current state
        run: |
          echo "=== Current template head ==="
          grep -E '^(version|revision|_rollup|_commit_id)=' \
            void-packages/srcpkgs/ungoogled-chromium/template || true
          echo
          echo "=== Current checksum block ==="
          grep -A 3 '^checksum=' void-packages/srcpkgs/ungoogled-chromium/template || true

      - name: Run update script
        id: update
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force }}
        run: |
          python3 .github/scripts/update_package.py

      - name: Show resulting diff
        if: steps.update.outputs.updated == 'true'
        run: |
          echo "=== Diff after auto-update ==="
          git --no-pager diff --stat || true
          echo
          git --no-pager diff -- void-packages/srcpkgs/ungoogled-chromium/template || true
          echo
          echo "=== New checksum block ==="
          grep -A 3 '^checksum=' void-packages/srcpkgs/ungoogled-chromium/template || true

      - name: Commit and push bump
        id: commit
        if: steps.update.outputs.updated == 'true'
        run: |
          NEW_VER="${{ steps.update.outputs.new_version }}"
          NEW_REV="${{ steps.update.outputs.new_revision }}"
          # Intentionally NO [ci-skip] / [skip ci]: see the next step — we
          # explicitly dispatch create-release.yml because a push made with
          # GITHUB_TOKEN does not retrigger push-triggered workflows.

          # Fetch the latest remote ref so we can detect the race where another
          # run (or a manual commit) already landed the same bump. This happens
          # often: e.g. a previous run pushed the bump, then failed at the
          # dispatch step, and on retry this run would try to bump the same
          # version again.
          git config --global --add safe.directory '*'
          git fetch --no-tags --force origin "${{ github.ref_name }}"

          REMOTE_VER="$(git show "origin/${{ github.ref_name }}:void-packages/srcpkgs/ungoogled-chromium/template" \
                        | awk -F '=' '/^version=/  { print $2; exit }')"
          REMOTE_REV="$(git show "origin/${{ github.ref_name }}:void-packages/srcpkgs/ungoogled-chromium/template" \
                        | awk -F '=' '/^revision=/{ print $2; exit }')"
          echo "Remote template: version=${REMOTE_VER} revision=${REMOTE_REV}"
          echo "Local  template: version=${NEW_VER} revision=${NEW_REV}"

          if [[ "${REMOTE_VER}" == "${NEW_VER}" && "${REMOTE_REV}" == "${NEW_REV}" ]]; then
            echo "::notice::Remote is already at ${NEW_VER}_${NEW_REV} — nothing to push. Dispatching create-release.yml on the existing commit."
            echo "commit_sha=$(git rev-parse 'origin/${{ github.ref_name }}')" >> $GITHUB_OUTPUT
            exit 0
          fi

          git add -A
          git commit -m \
            "chore: bump ungoogled-chromium to ${NEW_VER}_${NEW_REV}

          - version:  ${NEW_VER}
          - revision: ${NEW_REV}
          - checksums recomputed by .github/scripts/update_package.py
          - README version-info block refreshed

          Generated by .github/workflows/auto-update.yml"

          # Rebase on top of the latest remote master before pushing, and
          # retry a couple of times in case another run raced us.
          for attempt in 1 2 3; do
            echo "--- Push attempt $attempt ---"
            git fetch --no-tags --force origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then
              if git push origin "HEAD:${{ github.ref_name }}"; then
                echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
                echo "Push succeeded on attempt $attempt."
                exit 0
              fi
            else
              # rebase failed (e.g. conflicting bump on the same lines).
              # Check whether the remote already has the target version, in
              # which case we can just reuse it; otherwise abort and let the
              # next scheduled run retry from a clean checkout.
              RR_VER="$(git show "origin/${{ github.ref_name }}:void-packages/srcpkgs/ungoogled-chromium/template" \
                        | awk -F '=' '/^version=/  { print $2; exit }')"
              RR_REV="$(git show "origin/${{ github.ref_name }}:void-packages/srcpkgs/ungoogled-chromium/template" \
                        | awk -F '=' '/^revision=/{ print $2; exit }')"
              if [[ "${RR_VER}" == "${NEW_VER}" && "${RR_REV}" == "${NEW_REV}" ]]; then
                echo "::notice::After rebase failure, remote already has ${NEW_VER}_${NEW_REV}. Reusing it."
                git rebase --abort || true
                git reset --hard "origin/${{ github.ref_name }}"
                echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
                exit 0
              fi
              echo "::error::rebase failed; aborting. Manual intervention may be needed."
              git rebase --abort || true
              exit 1
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done
          echo "::error::Could not push after 3 attempts."
          exit 1

      - name: Dispatch create-release.yml
        if: steps.commit.outputs.commit_sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A GITHUB_TOKEN push does not retrigger push-triggered workflows,
          # but workflow_dispatch IS allowed from GITHUB_TOKEN. Trigger the
          # build pipeline on the ref we just pushed to. create-release.yml
          # has no workflow_dispatch inputs, so we must NOT pass any -f flags
          # (GitHub returns HTTP 422 "Unexpected inputs" if we do).
          gh workflow run create-release.yml --ref "${{ github.ref_name }}"
          echo "create-release.yml dispatched on ${{ github.ref_name }} @ ${{ steps.commit.outputs.commit_sha }}"

      - name: Summary (no update)
        if: steps.update.outputs.updated != 'true'
        run: |
          echo "Nothing to do — template is already at the latest available version."
          echo "(If a new Chromium release just shipped, the matching ungoogled-chromium"
          echo " tag and/or chromium-linux-tarballs release may not be published yet;"
          echo " the next scheduled run will pick it up.)"
