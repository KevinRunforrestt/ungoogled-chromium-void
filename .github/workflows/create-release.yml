name: Create release

# This workflow builds ungoogled-chromium for x86_64 (glibc) and x86_64-musl
# on GitHub-hosted runners, using the official void-linux/void-mklive image
# on GHCR (the same one used by github.com/javiercplus/repo-neko).
#
# Why void-mklive instead of voidlinux/voidlinux?
#   - The 2021 voidlinux/voidlinux{,-musl} images on Docker Hub ship an xbps
#     so old that it can't validate current TLS certificates
#     ("SSL certificate subject doesn't match host ... Operation not permitted").
#   - void-mklive is built from the live ISO master and is refreshed regularly
#     (tags like 20250116R1, 20250227R1). It ships a modern xbps + modern
#     ca-certificates, so `xbps-install -Syu` works out of the box.
#
# Why a single glibc image for both arches?
#   - void-mklive only publishes amd64/arm64 glibc images. There is no musl
#     variant. We don't need one: xbps-src's `-A x86_64-musl` flag does a
#     cross-build from a glibc host, downloading the musl bootstrap tarball
#     from repo-default.voidlinux.org/current/musl. This is exactly how the
#     void-linux/void-packages CI itself tests musl builds.
#
# Flow:
#   Fetch   (ubuntu-latest)  - reads version/revision from the template
#   Build   (ubuntu-22.04 + container void-mklive, matrix [glibc, musl])
#           - updates xbps itself before anything else (uses --repository
#             to bypass the broken default mirror config)
#           - installs runtime deps + xtools + sudo
#           - creates a 'builder' user in group 'xbuilder' so xbps-src can
#             use xbps-uchroot via the setuid helper
#           - clones void-packages, overlays our template
#           - runs: binary-bootstrap  →  fetch  →  pkg
#             (xbps-src internally calls xbps-create to assemble the .xbps
#              from $DESTDIR, then xbps-rindex -a to add it to hostdir/binpkgs)
#           - optionally signs packages with the SHIRAORI_PEM secret
#           - uploads .xbps (+.sig2 + repodata) as workflow artifacts
#   Release (ubuntu-latest)  - downloads both arch artifacts, creates release
#   Cleanup  (ubuntu-latest) - prunes old releases (keep_latest: 5)
#
# Required secrets (Settings → Secrets and variables → Actions):
#   SUPERBIA       - passphrase for shiraori.pem (used by xbps-rindex --sign)
#   SHIRAORI_PEM   - private key (PEM body) used to sign packages
# If SHIRAORI_PEM is empty, the sign step is skipped (release still happens,
# just without signatures).
#
# Resource notes:
#   ubuntu-latest         = 4 cores,  16 GB RAM, 14 GB disk
#   ubuntu-latest-large   = 8 cores,  32 GB RAM, 64 GB disk  (requires Team plan)
#   ubuntu-latest-xlarge  = 16 cores, 64 GB RAM, 80 GB disk  (requires Team plan)
# Chromium links with ~30 GB RAM when LTO is off (it is, per template).
# On ubuntu-latest the build WILL run but may OOM-kill the linker; if that
# happens, bump runs-on to ubuntu-latest-large or ubuntu-latest-xlarge.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'void-packages/srcpkgs/ungoogled-chromium/**'

jobs:
  Fetch:
    if: github.repository == 'KevinRunforrestt/ungoogled-chromium-void'
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.version.outputs.ver }}
      rev: ${{ steps.version.outputs.rev }}
      skip_ci: ${{ steps.ci_skip_check.outputs.skip_ci }}
    steps:
      - name: Check for [ci-skip] in commit message
        id: ci_skip_check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "${COMMIT_MSG}" | grep -iqE '\[ci-skip\]|\[skip ci\]'; then
            echo "CI skip detected. Skipping further steps."
            echo "skip_ci=true" >> $GITHUB_OUTPUT
          else
            echo "skip_ci=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Fetch this repository
        if: steps.ci_skip_check.outputs.skip_ci == 'false'
        uses: actions/checkout@v4
        with:
          path: master

      - name: Read version/revision
        if: steps.ci_skip_check.outputs.skip_ci == 'false'
        id: version
        run: |
          echo "ver=$( grep -m 1 'version='  master/void-packages/srcpkgs/ungoogled-chromium/template | awk -F '=' '{ print $2 }' )" >> $GITHUB_OUTPUT
          echo "rev=$( grep -m 1 'revision=' master/void-packages/srcpkgs/ungoogled-chromium/template | awk -F '=' '{ print $2 }' )" >> $GITHUB_OUTPUT

  Build:
    needs: [Fetch]
    if: needs.Fetch.outputs.skip_ci == 'false'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # XBPS_ARCH is what xbps-src will pass to its target. -A is the
          # shortcut xbps-src exposes for setting it.
          #   x86_64       = native glibc build (container is glibc/amd64)
          #   x86_64-musl  = cross build: glibc host compiles musl target via
          #                  the musl bootstrap tarball from
          #                  repo-fastly.voidlinux.org/current/musl
          - arch: x86_64
            description: "glibc"
            # glibc repo lives at the root of /current/
            repo: "https://repo-fastly.voidlinux.org/current/"
          - arch: x86_64-musl
            description: "musl"
            # musl repo lives under /current/musl/
            repo: "https://repo-fastly.voidlinux.org/current/musl/"
    # ubuntu-22.04 is what repo-neko uses and is known to work with
    # `container: image: ghcr.io/void-linux/void-mklive:...` + --privileged.
    runs-on: ubuntu-22.04
    timeout-minutes: 1440
    container:
      image: ghcr.io/void-linux/void-mklive:20250116R1
      options: --privileged
    env:
      XBPS_TARGET_ARCH: ${{ matrix.arch }}
      PKG_VER: ${{ needs.Fetch.outputs.ver }}
      PKG_REV: ${{ needs.Fetch.outputs.rev }}
      # The default mirror baked into the image (alpha.de.repo.voidlinux.org)
      # has an expired / mismatched TLS cert and the host no longer exists.
      # Force the Fastly CDN mirror for every xbps-install call below.
      XBPS_REPO: ${{ matrix.repo }}
    steps:
      - name: Force Fastly CDN mirror and install tools
        # ============================================================
        # CRITICAL — read this before editing.
        # ============================================================
        # The container (ghcr.io/void-linux/void-mklive) is ALWAYS glibc
        # on amd64, even when we cross-build for musl. So the HOST's
        # /etc/xbps.d/ must ONLY list glibc repos — listing the musl repo
        # here caused xbps-install to download musl .xbps packages
        # (musl-1.2.5_3, xbps-0.60.7_1.x86_64-musl.xbps, ...) and install
        # them on top of the glibc rootfs, which produced:
        #   Error relocating /lib/libarchive.so.13: __open_2: symbol not found
        #   Error relocating /lib/libarchive.so.13: __snprintf_chk: symbol not found
        #   ... (and exit code 127)
        #
        # The musl repo IS still needed, but only INSIDE the xbps-src
        # build chroot — xbps-src copies void-packages/etc/xbps.d/
        # into the chroot and selects the right repos-remote-*.conf
        # based on XBPS_ARCH. We rewrite those files in a later step
        # to also point at Fastly.
        env:
          XBPS_REPO: ${{ matrix.repo }}
        run: |
          echo "Target arch:    ${XBPS_TARGET_ARCH}"
          echo "Using XBPS repo: ${XBPS_REPO}  (used only for the musl target inside xbps-src)"

          # The HOST container is glibc, regardless of XBPS_TARGET_ARCH.
          # Wipe any xbps.d fragments the image might ship and write a
          # single one pointing at the Fastly glibc repo.
          rm -f /etc/xbps.d/*.conf
          mkdir -p /etc/xbps.d
          cat > /etc/xbps.d/00-repository-main.conf <<'EOF'
          repository=https://repo-fastly.voidlinux.org/current/
          EOF

          echo "=== /etc/xbps.d/00-repository-main.conf (HOST, always glibc) ==="
          cat /etc/xbps.d/00-repository-main.conf

          # Two-step update: upgrade xbps itself first (so it can handle
          # current repo signatures), then the rest of the system, then
          # the runtime deps we need for xbps-src + signing.
          xbps-install -Syu xbps
          xbps-install -Suyd
          xbps-install -y \
            base-chroot base-devel git curl ca-certificates \
            python3 bash sudo xtools openssl tar xz

          # Create the build user. xbps-src refuses to run as root, and the
          # setuid xbps-uchroot helper requires group 'xbuilder'.
          groupadd -f xbuilder
          useradd -m -s /bin/bash -G xbuilder builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Clone void-packages and overlay our template
        env:
          # GITHUB_WORKSPACE inside a `container:` block points at the
          # mount root (typically /__w/<repo>/<repo>). The `repo/` subdir
          # is where actions/checkout just dropped our source tree.
          WS: ${{ github.workspace }}
        run: |
          git clone --depth 1 https://github.com/void-linux/void-packages.git /tmp/void-packages
          cd /tmp/void-packages

          # Replace the upstream ungoogled-chromium template with ours.
          rm -rf srcpkgs/ungoogled-chromium srcpkgs/ungoogled-chromium-qt6
          cp -r "${WS}/repo/void-packages/srcpkgs/ungoogled-chromium"    srcpkgs/
          cp -r "${WS}/repo/void-packages/srcpkgs/ungoogled-chromium-qt6" srcpkgs/

          # ============================================================
          # Rewrite xbps-src's repo fragments to point at Fastly CDN.
          # ============================================================
          # void-packages ships etc/xbps.d/repos-remote*.conf that point
          # at repo-default.voidlinux.org, which sometimes resolves to
          # mirrors with expired TLS certs (alpha.de.repo.voidlinux.org).
          # xbps-src copies these files into the build chroot and selects
          # the right one based on XBPS_ARCH (repos-remote.conf for glibc,
          # repos-remote-musl.conf for musl, repos-remote-x86_64-multilib
          # for multilib, etc.).
          #
          # We rewrite ALL of them to point at Fastly so xbps-src's
          # internal xbps-install / xbps-query calls work regardless of
          # which arch xbps-src is targeting.
          for f in etc/xbps.d/repos-remote*.conf; do
            case "$f" in
              *musl*)
                # musl repo lives under /current/musl/
                cat > "$f" <<'EOF'
          repository=https://repo-fastly.voidlinux.org/current/musl/bootstrap
          repository=https://repo-fastly.voidlinux.org/current/musl
          repository=https://repo-fastly.voidlinux.org/current/musl/nonfree
          repository=https://repo-fastly.voidlinux.org/current/musl/debug
          EOF
                ;;
              *multilib*)
                # multilib repo lives under /current/multilib/
                cat > "$f" <<'EOF'
          repository=https://repo-fastly.voidlinux.org/current/multilib/bootstrap
          repository=https://repo-fastly.voidlinux.org/current/multilib
          repository=https://repo-fastly.voidlinux.org/current/multilib/nonfree
          EOF
                ;;
              *)
                # Default: glibc repo at /current/
                cat > "$f" <<'EOF'
          repository=https://repo-fastly.voidlinux.org/current/bootstrap
          repository=https://repo-fastly.voidlinux.org/current
          repository=https://repo-fastly.voidlinux.org/current/nonfree
          repository=https://repo-fastly.voidlinux.org/current/debug
          EOF
                ;;
            esac
          done

          # Also append XBPS_DISTFILES_MIRROR to etc/conf so xbps-src's
          # fetch step downloads distfiles from Fastly too.
          cat >> etc/conf <<EOF

          # Added by create-release.yml — force Fastly CDN mirror for distfiles
          XBPS_DISTFILES_MIRROR=https://repo-fastly.voidlinux.org/current
          EOF

          echo "=== void-packages/etc/xbps.d/repos-remote.conf (glibc) ==="
          cat etc/xbps.d/repos-remote.conf
          echo
          echo "=== void-packages/etc/xbps.d/repos-remote-musl.conf ==="
          cat etc/xbps.d/repos-remote-musl.conf 2>/dev/null || echo "(not present)"
          echo
          echo "=== void-packages/etc/conf (tail) ==="
          tail -5 etc/conf
          echo
          echo "=== Template head (sanity check) ==="
          grep -E '^(version|revision|_rollup|_commit_id)=' srcpkgs/ungoogled-chromium/template

          chown -R builder:builder /tmp/void-packages

      - name: Build ungoogled-chromium (${{ matrix.description }})
        env:
          XBPS_PASSPHRASE: ${{ secrets.SUPERBIA }}
        run: |
          # Run as 'builder' so xbps-src can use xbps-uchroot (setuid).
          # -A ${{ matrix.arch }} tells xbps-src the target arch. For musl,
          # xbps-src will automatically download the musl bootstrap tarball
          # from the musl/ subrepo.
          su - builder -c 'cd /tmp/void-packages && ./xbps-src -A '"${XBPS_TARGET_ARCH}"' binary-bootstrap'
          su - builder -c 'cd /tmp/void-packages && ./xbps-src -A '"${XBPS_TARGET_ARCH}"' fetch ungoogled-chromium'
          su - builder -c 'cd /tmp/void-packages && ./xbps-src -A '"${XBPS_TARGET_ARCH}"' -C pkg ungoogled-chromium'

          echo "=== Produced packages ==="
          ls -la /tmp/void-packages/hostdir/binpkgs/ungoogled-chromium* || true

      - name: Sign packages (optional — only if SHIRAORI_PEM is set)
        env:
          SHIRAORI_PEM: ${{ secrets.SHIRAORI_PEM }}
          XBPS_PASSPHRASE: ${{ secrets.SUPERBIA }}
        run: |
          if [ -z "${SHIRAORI_PEM}" ]; then
            echo "SHIRAORI_PEM secret is not set — skipping signing step."
            echo "Packages will still be released, just without .sig2 signatures."
            exit 0
          fi

          printf '%s\n' "${SHIRAORI_PEM}" > /tmp/shiraori.pem
          chmod 600 /tmp/shiraori.pem

          cd /tmp/void-packages/hostdir/binpkgs
          # xbps-rindex names the repodata file after the target arch.
          rm -f "${XBPS_TARGET_ARCH}-repodata"

          xbps-rindex -a "ungoogled-chromium-${PKG_VER}_${PKG_REV}.${XBPS_TARGET_ARCH}.xbps"
          xbps-rindex -a "ungoogled-chromium-qt6-${PKG_VER}_${PKG_REV}.${XBPS_TARGET_ARCH}.xbps"

          xbps-rindex --sign --signedby "Shiraori archive" \
            --privkey /tmp/shiraori.pem "$PWD"

          xbps-rindex --sign-pkg --privkey /tmp/shiraori.pem \
            "ungoogled-chromium-${PKG_VER}_${PKG_REV}.${XBPS_TARGET_ARCH}.xbps"
          xbps-rindex --sign-pkg --privkey /tmp/shiraori.pem \
            "ungoogled-chromium-qt6-${PKG_VER}_${PKG_REV}.${XBPS_TARGET_ARCH}.xbps"

          rm -f /tmp/shiraori.pem
          echo "=== Signed packages ==="
          ls -la ungoogled-chromium* "${XBPS_TARGET_ARCH}-repodata" 2>/dev/null || true

      - name: Upload binpkgs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: binpkgs-${{ matrix.arch }}
          path: |
            /tmp/void-packages/hostdir/binpkgs/ungoogled-chromium-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.${{ matrix.arch }}.xbps
            /tmp/void-packages/hostdir/binpkgs/ungoogled-chromium-qt6-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.${{ matrix.arch }}.xbps
            /tmp/void-packages/hostdir/binpkgs/ungoogled-chromium-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.${{ matrix.arch }}.xbps.sig2
            /tmp/void-packages/hostdir/binpkgs/ungoogled-chromium-qt6-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.${{ matrix.arch }}.xbps.sig2
            /tmp/void-packages/hostdir/binpkgs/${{ matrix.arch }}-repodata
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  Release:
    needs: [Fetch, Build]
    if: needs.Fetch.outputs.skip_ci == 'false' && always() && needs.Build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all binpkgs artifacts
        uses: actions/download-artifact@v4
        with:
          path: binpkgs
          pattern: binpkgs-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded .xbps files ==="
          ls -la binpkgs/ || true

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Chromium release: ${{ needs.Fetch.outputs.ver }}
            Ungoogled Chromium release: ${{ needs.Fetch.outputs.ver }}-${{ needs.Fetch.outputs.rev }}
          files: |
            binpkgs/ungoogled-chromium-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64.xbps
            binpkgs/ungoogled-chromium-qt6-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64.xbps
            binpkgs/ungoogled-chromium-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64.xbps.sig2
            binpkgs/ungoogled-chromium-qt6-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64.xbps.sig2
            binpkgs/x86_64-repodata
            binpkgs/ungoogled-chromium-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64-musl.xbps
            binpkgs/ungoogled-chromium-qt6-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64-musl.xbps
            binpkgs/ungoogled-chromium-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64-musl.xbps.sig2
            binpkgs/ungoogled-chromium-qt6-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64-musl.xbps.sig2
            binpkgs/x86_64-musl-repodata
          tag_name: ${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}
          fail_on_unmatched_files: false

  Cleanup:
    needs: [Release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old release files (keep 5 latest)
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
